services:
  media-agent:
    image: ${SEED_AGENT_IMAGE:?Set a verified immutable image reference}
    # For local source deployments, uncomment:
    # build:
    #   context: ..
    container_name: media-agent
    restart: "on-failure:5"
    cpus: "1.0"
    mem_limit: 1024m
    pids_limit: 128
    read_only: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    labels:
      org.opencontainers.image.icon: https://raw.githubusercontent.com/Team-Cyan/media-agent/main/docs/assets/icon.png
    environment:
      SEED_AGENT_MODE: app
      SEED_AGENT_CONFIG: /app/config/config.yaml
      SEED_AGENT_IMAGE_DIGEST: ${SEED_AGENT_IMAGE_DIGEST:?Set the deployed image digest}
      SEED_AGENT_EXECUTE: "true"
      SEED_AGENT_HEARTBEAT_FILE: /state/schedule-heartbeat.json
      SEED_AGENT_MAX_STALENESS_MINUTES: "90"
      SEED_AGENT_STARTUP_STATUS: "true"
      SEED_AGENT_WEB_ENABLED: "true"
      SEED_AGENT_WEB_HOST: 0.0.0.0
      SEED_AGENT_WEB_PORT: "8765"
      SEED_AGENT_WEB_TOKEN: ${SEED_AGENT_WEB_TOKEN:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-100}
    ports:
      - "8765:8765"
    volumes:
      - ../config:/app/config
      - ../local:/app/local
      - ../.seed-agent:/app/.seed-agent
      - ../.media-import:/app/.media-import
      - ../state:/state
      # One common RW parent, without nested overlays, for hardlinks.
      # Source preservation is application-enforced, not kernel-enforced RO.
      - ${MEDIA_PARENT_DIR:?Set the common source and library parent}:/media:rw
    healthcheck:
      test: ["CMD", "/app/docker/entrypoint.sh", "app-healthcheck"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 4m
